<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Balloony Tunes</title>

  <!-- Pixel font (if you change it, also change FONT_NAME in sketch.js) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

  <style>
    /* Balloony Tunes: page styles. All the drawing happens in sketch.js */

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;       /* no scrollbars */
      background: #000;
      overscroll-behavior: none;
    }

    canvas {
      display: block;         /* removes the small gap under the canvas */
      touch-action: none;     /* stops the page zooming or scrolling when tapping balloons */
    }
  </style>

  <!-- p5.js library -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>
</head>
<body>

<script>
// =====================================================
// PIXEL BALLOONS — LIGHT MODE
// Blow to inflate, tap to pop, clap to pop released balloons.
// =====================================================

// ---------- settings ----------
const BLOW_LEVEL = 0.01;
const BLOW_RANGE = 0.025;
const INFLATE_RATE = 1.6;
const CLAP_LEVEL = 0.10;

const MAX_BALLOONS = 8;
const BALLOON_SIZE = 0.22;
const POP_VOLUME = 0.35;
const INFLATE_VOLUME = 0.18;

// Voice when a balloon is fully inflated (0.5 = 50%)
const VOICE_VOLUME = 0.5;

// Optional: real recorded clips. Upload the files to your sketch and
// list them here, e.g. ['wheee.mp3', 'woah.mp3', 'heee.mp3'].
// Leave empty to use the built-in synthesized voices.
const VOICE_FILES = [];

// Synthesized voices: pitch and vowel shape at start / middle / end.
// Vowel = [formant 1, formant 2] in Hz. "ee" = [270, 2300], "oo" = [300, 870], "ah" = [730, 1090]
const VOICES = [
  { // wheee — rising
    dur: 0.65,
    pitch: [280, 380, 620],
    vowels: [[300, 870], [270, 2300], [270, 2300]],
    vibrato: 10,
    breath: 0
  },
  { // woooah — dips then lifts
    dur: 0.8,
    pitch: [330, 250, 420],
    vowels: [[300, 870], [300, 870], [730, 1090]],
    vibrato: 18,
    breath: 0
  },
  { // heeee — breathy, high
    dur: 0.7,
    pitch: [520, 580, 470],
    vowels: [[270, 2300], [270, 2300], [270, 2300]],
    vibrato: 12,
    breath: 0.12
  }
];

const CLOUD_COUNT = 6;

// Start page: how long each blink state of the READY button lasts, in milliseconds
// (lower = blinks faster)
const BUTTON_BLINK_MS = 550;

// true  = show the title page first and wait for a tap
// false = skip it: the game starts right away (the browser still asks to use the microphone)
const SHOW_START_PAGE = true;

// Browsers keep sound asleep until the first touch, so with no start page this small hint
// shows until someone touches the screen once. Set it to '' to hide it
// (then touch the screen once yourself when setting up each phone).
const WAKE_HINT = 'TAP ONCE TO WAKE UP';
const PIXELS_ACROSS = 48;

const COLORS = [
  '#FF4A55', // Coral red
  '#FF9E26', // Orange
  '#2C4CCC', // Blue
  '#FF64D9', // Pink
  '#6ACC2C'  // Green
];

const SKY_COLOR = '#ADD6FF';
const CLOUD_COLOR = '#FFFFFF';
const CLOUD_SHADOW = '#EAF4FF';
const STRING_COLOR = '#36516F';
const TEXT_COLOR = '#24415F';

// Face colours
const FACE_COLOR = '#1C2033';
const EYE_SHINE = '#CFF3FF';

// Face only appears once the balloon is this wide (in pixel blocks)
const FACE_MIN_SIZE = 4;

// ---------- font ----------
// Any Google Font name works here, e.g. 'Press Start 2P', 'Silkscreen', 'VT323', 'Pixelify Sans'.
// The sketch downloads it itself, so there is nothing to add to index.html.
// (Text sizes were tuned for Press Start 2P; other fonts may need a size tweak.)
const FONT_NAME = 'Press Start 2P';
// ---------- pixel face shapes ----------
// "O" mouth while being blown up, smile once released
const MOUTH_O_BIG = [
  ' ### ',
  '#####',
  '#####',
  '#####',
  ' ### '
];

const MOUTH_O_SMALL = [
  ' # ',
  '###',
  ' # '
];

const SMILE_BIG = [
  '#####',
  '#####',
  ' ### '
];

const SMILE_SMALL = [
  '###',
  ' # '
];

// ---------- state ----------
let audioCtx, analyser, samples;
let micStream = null;
let ready = false;
let started = !SHOW_START_PAGE; // false while the start page is waiting for a tap

let message = 'STARTING…';

let level = 0;
let lastRaw = 0;
let clapTimer = 0;
let clapPeak = 0;
let flash = 0;
let muteTimer = 0;
let lastPopSound = -1;
let pix = 6;

let balloons = [];
let rings = [];
let clouds = [];

let colorBag = [];
let lastColor = null;

let voiceBuffers = [];
let lastVoice = -1;
let wakeLock = null;

// ---------- setup ----------
function setup() {
  loadPixelFont();
  createCanvas(windowWidth, windowHeight);
  setPixelSize();

  textAlign(CENTER, CENTER);
  textFont(FONT_NAME);
  noStroke();
  noSmooth();

  for (let i = 0; i < CLOUD_COUNT; i++) {
    clouds.push(newCloud(true));
  }

  // Start with one small balloon
  balloons.push(newBalloon());

  // No start page: ask for the microphone straight away
  if (!SHOW_START_PAGE) {
    startMic();
  }

  // The browser drops the wake lock when the tab is hidden; take it back on return
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ready) {
      requestWakeLock();
    }
  });
}

// Adds the Google Fonts stylesheet to the page, then asks the browser to fetch the font.
function loadPixelFont() {
  // The font itself is linked in index.html; this just waits for it
  // and falls back to plain monospace if it can't be loaded (no internet?)
  document.fonts.load("16px '" + FONT_NAME + "'").then((fonts) => {
    if (fonts.length === 0) textFont('monospace');
  }).catch(() => textFont('monospace'));
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  setPixelSize();
}

function setPixelSize() {
  pix = max(3, floor(min(width, height) / PIXELS_ACROSS));
}

// ---------- main loop ----------
function draw() {
  const dt = min(deltaTime / 1000, 0.05);

  background(SKY_COLOR);

  moveClouds(dt);
  drawClouds();

  if (ready) {
    listen(dt);
    inflate(dt);
    drift(dt);
  }

  if (started) {
    for (const b of balloons) {
      drawBalloon(b);
    }

    drawRings(dt);
    drawText();
  } else {
    drawStartPage();
  }
}

// ---------- balloon creation ----------
function newBalloon() {
  const u = min(width, height);

  return {
    x: width / 2,
    y: height * 0.78,
    r: u * BALLOON_SIZE * random(0.9, 1.05),
    air: 0,
    inflating: true,
    dir: random(TWO_PI),
    speed: u * random(0.03, 0.07),
    col: nextColor()
  };
}

// ---------- colour order ----------
// Uses every colour once in a random order before reshuffling.
function nextColor() {
  if (colorBag.length === 0) {
    colorBag = shuffle(COLORS);

    // Avoid the same colour twice in a row across reshuffles
    if (colorBag.length > 1 && colorBag[0] === lastColor) {
      colorBag.push(colorBag.shift());
    }
  }

  lastColor = colorBag.shift();
  return lastColor;
}

// ---------- blowing ----------
function getBlowStrength() {
  return constrain(
    (level - BLOW_LEVEL) / BLOW_RANGE,
    0,
    1
  );
}

function inflate(dt) {
  const b = balloons[balloons.length - 1];
  if (!b || !b.inflating) return;

  const blow = getBlowStrength();

  b.x = width / 2;
  b.y = height * 0.78;

  b.air +=
    blow * INFLATE_RATE * dt -
    (1 - blow) * 0.1 * dt;

  b.air = constrain(b.air, 0, 1);

  // When full, release the balloon and play a rising sound
  if (b.air >= 1) {
    b.inflating = false;
    playInflateSound();
    playVoice();

    balloons.push(newBalloon());

    if (balloons.length > MAX_BALLOONS) {
      popBalloon(balloons[0]);
      balloons.shift();
    }
  }
}

// ---------- balloon movement ----------
function drift(dt) {
  const loose = balloons.filter(b => !b.inflating);

  for (const b of loose) {
    b.dir += random(-1, 1) * dt * 1.5;
    b.x += cos(b.dir) * b.speed * dt;
    b.y += sin(b.dir) * b.speed * dt;
  }

  // Balloons gently push each other apart
  for (let i = 0; i < loose.length; i++) {
    for (let j = i + 1; j < loose.length; j++) {
      const a = loose[i];
      const c = loose[j];

      const dx = c.x - a.x;
      const dy = c.y - a.y;
      const d = max(sqrt(dx * dx + dy * dy), 0.01);
      const overlap = a.r + c.r - d;

      if (overlap > 0) {
        a.x -= (dx / d) * overlap / 2;
        a.y -= (dy / d) * overlap / 2;
        c.x += (dx / d) * overlap / 2;
        c.y += (dy / d) * overlap / 2;
      }
    }
  }

  for (const b of loose) {
    bounceOffWalls(b);
  }
}

function bounceOffWalls(b) {
  const bottom = height - b.r * 2;

  if (b.x < b.r || b.x > width - b.r) {
    b.x = constrain(b.x, b.r, width - b.r);
    b.dir = PI - b.dir;
  }

  if (b.y < b.r || b.y > bottom) {
    b.y = constrain(b.y, b.r, bottom);
    b.dir = -b.dir;
  }
}

// ---------- popping ----------
function popBalloon(b) {
  rings.push({
    x: b.x,
    y: b.y,
    r: b.r,
    col: b.col,
    t: 0
  });

  playPop();
}

function popAll() {
  flash = 100;

  for (const b of balloons) {
    if (!b.inflating) {
      popBalloon(b);
    }
  }

  balloons = balloons.filter(b => b.inflating);
}

// ---------- microphone ----------
async function startMic() {
  try {
    audioCtx = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    audioCtx.resume(); // not awaited: with no tap, the browser may keep audio paused until the first touch
    message = 'ASKING FOR MIC…';

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;

    samples = new Float32Array(analyser.fftSize);

    audioCtx
      .createMediaStreamSource(micStream)
      .connect(analyser);

    ready = true;
    message = '';

    requestWakeLock();
    loadVoiceFiles();
  } catch (err) {
    message =
      'MIC PROBLEM\n' +
      err.name +
      '\nCHECK MIC PERMISSION';

    // Throw this one away so the next tap can try again
    if (audioCtx) audioCtx.close();
    audioCtx = null;
  }
}

function listen(dt) {
  analyser.getFloatTimeDomainData(samples);

  let sum = 0;

  for (const s of samples) {
    sum += s * s;
  }

  const raw = sqrt(sum / samples.length);

  // Ignore speaker output briefly after sounds
  if (muteTimer > 0) {
    muteTimer -= dt;
    level = 0;
    clapTimer = 0;
    lastRaw = raw;
    return;
  }

  checkClap(raw, dt);
  level = lerp(level, raw, 0.35);
  lastRaw = raw;
}

// ---------- clap detection ----------
function checkClap(raw, dt) {
  if (clapTimer > 0) {
    clapTimer -= dt;
    clapPeak = max(clapPeak, raw);

    if (clapTimer <= 0 && level < clapPeak * 0.4) {
      popAll();
    }
  } else if (
    raw > CLAP_LEVEL &&
    raw - lastRaw > 0.05 &&
    level < 0.06
  ) {
    clapTimer = 0.1;
    clapPeak = raw;
  }
}

// ---------- inflation sound ----------
// A bubbly two-note rise, opposite to the falling pop sound.
function playInflateSound() {
  if (!audioCtx) return;

  const t = audioCtx.currentTime;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.linearRampToValueAtTime(
    INFLATE_VOLUME,
    t + 0.035
  );
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    t + 0.38
  );
  gain.connect(audioCtx.destination);

  // Two ascending notes
  const notes = [
    { frequency: 520, start: 0 },
    { frequency: 780, start: 0.12 }
  ];

  for (const note of notes) {
    const osc = audioCtx.createOscillator();
    const noteGain = audioCtx.createGain();

    osc.type = 'sine';

    osc.frequency.setValueAtTime(
      note.frequency,
      t + note.start
    );

    osc.frequency.exponentialRampToValueAtTime(
      note.frequency * 1.35,
      t + note.start + 0.16
    );

    noteGain.gain.setValueAtTime(
      0.001,
      t + note.start
    );

    noteGain.gain.linearRampToValueAtTime(
      0.65,
      t + note.start + 0.025
    );

    noteGain.gain.exponentialRampToValueAtTime(
      0.001,
      t + note.start + 0.19
    );

    osc.connect(noteGain);
    noteGain.connect(gain);

    osc.start(t + note.start);
    osc.stop(t + note.start + 0.2);
  }
}

// ---------- voice when fully inflated ----------
// Plays one of three sounds at random (never the same one twice in a row).
function playVoice() {
  if (!audioCtx) return;

  const count = voiceBuffers.length > 0
    ? voiceBuffers.length
    : VOICES.length;

  let i = floor(random(count));
  if (count > 1 && i === lastVoice) {
    i = (i + 1) % count;
  }
  lastVoice = i;

  if (voiceBuffers.length > 0) {
    playVoiceFile(voiceBuffers[i]);
  } else {
    synthVoice(VOICES[i]);
  }
}

function playVoiceFile(buffer) {
  const t = audioCtx.currentTime;

  const gain = audioCtx.createGain();
  gain.gain.value = VOICE_VOLUME;
  gain.connect(audioCtx.destination);

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(gain);
  src.start(t);

  // Stop the mic hearing the voice as blowing
  muteTimer = max(muteTimer, buffer.duration + 0.1);
}

function synthVoice(v) {
  const t = audioCtx.currentTime;
  const end = t + v.dur;
  const mid = t + v.dur * 0.4;

  // Overall volume envelope
  const out = audioCtx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(VOICE_VOLUME, t + 0.06);
  out.gain.setValueAtTime(VOICE_VOLUME, t + v.dur * 0.7);
  out.gain.exponentialRampToValueAtTime(0.0001, end);
  out.connect(audioCtx.destination);

  // Vocal "buzz" with a pitch glide
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(v.pitch[0], t);
  osc.frequency.linearRampToValueAtTime(v.pitch[1], mid);
  osc.frequency.linearRampToValueAtTime(v.pitch[2], end);

  // Wobble
  const lfo = audioCtx.createOscillator();
  const lfoDepth = audioCtx.createGain();
  lfo.frequency.value = 6;
  lfoDepth.gain.value = v.vibrato;
  lfo.connect(lfoDepth);
  lfoDepth.connect(osc.frequency);

  // Two formant filters shape the buzz into a vowel
  const f1 = audioCtx.createBiquadFilter();
  const f2 = audioCtx.createBiquadFilter();
  const f2Level = audioCtx.createGain();

  f1.type = 'bandpass';
  f2.type = 'bandpass';
  f1.Q.value = 8;
  f2.Q.value = 10;
  f2Level.gain.value = 0.6;

  f1.frequency.setValueAtTime(v.vowels[0][0], t);
  f1.frequency.linearRampToValueAtTime(v.vowels[1][0], mid);
  f1.frequency.linearRampToValueAtTime(v.vowels[2][0], end);

  f2.frequency.setValueAtTime(v.vowels[0][1], t);
  f2.frequency.linearRampToValueAtTime(v.vowels[1][1], mid);
  f2.frequency.linearRampToValueAtTime(v.vowels[2][1], end);

  // Filters cut a lot of level, so boost back up a bit
  const boost = audioCtx.createGain();
  boost.gain.value = 2.5;
  boost.connect(out);

  osc.connect(f1);
  osc.connect(f2);
  f1.connect(boost);
  f2.connect(f2Level);
  f2Level.connect(boost);

  osc.start(t);
  lfo.start(t);
  osc.stop(end + 0.05);
  lfo.stop(end + 0.05);

  // Breathy "h" at the start
  if (v.breath > 0) {
    const len = floor(audioCtx.sampleRate * v.breath);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);

    for (let i = 0; i < len; i++) {
      data[i] = random(-1, 1);
    }

    const noise = audioCtx.createBufferSource();
    const hiss = audioCtx.createBiquadFilter();
    const hissGain = audioCtx.createGain();

    noise.buffer = buf;
    hiss.type = 'bandpass';
    hiss.frequency.value = 2200;
    hiss.Q.value = 1.5;

    hissGain.gain.setValueAtTime(VOICE_VOLUME * 0.6, t);
    hissGain.gain.exponentialRampToValueAtTime(0.0001, t + v.breath);

    noise.connect(hiss);
    hiss.connect(hissGain);
    hissGain.connect(audioCtx.destination);
    noise.start(t);
  }

  // Stop the mic hearing the voice as blowing
  muteTimer = max(muteTimer, v.dur + 0.1);
}

async function loadVoiceFiles() {
  for (const file of VOICE_FILES) {
    try {
      const res = await fetch(file);
      const data = await res.arrayBuffer();
      voiceBuffers.push(await audioCtx.decodeAudioData(data));
    } catch (err) {
      console.warn('Could not load voice file:', file);
    }
  }
}

// ---------- keep screen awake ----------
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;

  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch (err) {
    console.warn('Wake lock not available:', err.name);
  }
}

// ---------- pop sound ----------
function playPop() {
  if (!audioCtx) return;

  muteTimer = max(muteTimer, 0.35);

  const t = audioCtx.currentTime;

  if (t - lastPopSound < 0.05) return;
  lastPopSound = t;

  const volume = audioCtx.createGain();

  volume.gain.setValueAtTime(POP_VOLUME, t);
  volume.gain.exponentialRampToValueAtTime(
    0.001,
    t + 0.15
  );

  volume.connect(audioCtx.destination);

  // Descending arcade blip
  const blip = audioCtx.createOscillator();
  const pitch = random(500, 800);

  blip.type = 'square';
  blip.frequency.setValueAtTime(pitch, t);
  blip.frequency.exponentialRampToValueAtTime(
    pitch / 5,
    t + 0.12
  );

  blip.connect(volume);
  blip.start(t);
  blip.stop(t + 0.15);

  // Short noise crack
  const length = floor(audioCtx.sampleRate * 0.05);

  const noiseBuffer = audioCtx.createBuffer(
    1,
    length,
    audioCtx.sampleRate
  );

  const data = noiseBuffer.getChannelData(0);

  for (let i = 0; i < length; i++) {
    data[i] = random(-1, 1) * (1 - i / length);
  }

  const crack = audioCtx.createBufferSource();
  crack.buffer = noiseBuffer;
  crack.connect(volume);
  crack.start(t);
}

// ---------- mouse and touch ----------
// Works for both fingers (touch) and mouse clicks
let lastTapTime = 0;

function handleTap(x, y) {
  // Ignore the second event if a phone sends both touch and mouse
  if (millis() - lastTapTime < 80) return;
  lastTapTime = millis();

  // First tap: leave the start page and start the mic
  if (!started) {
    started = true;
    startMic();
    return;
  }

  if (audioCtx) audioCtx.resume();

  // Pop the closest released balloon under the finger
  // (the generous 1.5 means you don't have to hit it exactly)
  let best = -1;
  let bestGap = Infinity;

  for (let i = 0; i < balloons.length; i++) {
    const b = balloons[i];
    if (b.inflating) continue;

    const gap = dist(x, y, b.x, b.y);
    if (gap < b.r * 1.5 && gap < bestGap) {
      best = i;
      bestGap = gap;
    }
  }

  if (best >= 0) {
    popBalloon(balloons[best]);
    balloons.splice(best, 1);
  } else if (!audioCtx) {
    // Missed every balloon and the mic isn't running: try the mic again
    startMic();
  }
}

function touchStarted() {
  if (touches.length > 0) {
    handleTap(touches[0].x, touches[0].y);
  } else {
    handleTap(mouseX, mouseY);
  }
  return false;
}

function mousePressed() {
  handleTap(mouseX, mouseY);
  return false;
}

// ---------- pixel helper ----------
function block(x, y, w = 1, h = 1) {
  rect(
    round(x / pix) * pix,
    round(y / pix) * pix,
    w * pix,
    h * pix
  );
}

// Draws a string-array pixel pattern, centred horizontally on cx
function drawPattern(pattern, cx, top) {
  const left = cx - floor(pattern[0].length / 2) * pix;

  for (let row = 0; row < pattern.length; row++) {
    for (let col = 0; col < pattern[row].length; col++) {
      if (pattern[row][col] === '#') {
        block(left + col * pix, top + row * pix);
      }
    }
  }
}

// ---------- smaller pixel clouds ----------
const CLOUD_SHAPE = [
  '   ###   ',
  ' ######## ',
  '##########',
  ' ######## '
];

function newCloud(startAnywhere) {
  // Smaller clouds: most use a single pixel block
  const blockSize = random() < 0.8 ? 1 : 2;

  return {
    x: startAnywhere
      ? random(width)
      : -CLOUD_SHAPE[0].length * blockSize * pix,

    y: random(height * 0.04, height * 0.7),

    blockSize: blockSize,

    speed:
      min(width, height) *
      random(0.015, 0.03) *
      blockSize
  };
}

function moveClouds(dt) {
  for (let i = 0; i < clouds.length; i++) {
    clouds[i].x += clouds[i].speed * dt;

    if (clouds[i].x > width) {
      clouds[i] = newCloud(false);
    }
  }
}

function drawClouds() {
  for (const c of clouds) {
    fill(
      c.blockSize === 2
        ? CLOUD_COLOR
        : CLOUD_SHADOW
    );

    for (let row = 0; row < CLOUD_SHAPE.length; row++) {
      for (let col = 0; col < CLOUD_SHAPE[row].length; col++) {
        if (CLOUD_SHAPE[row][col] === '#') {
          block(
            c.x + col * c.blockSize * pix,
            c.y + row * c.blockSize * pix,
            c.blockSize,
            c.blockSize
          );
        }
      }
    }
  }
}

// ---------- pixel balloon drawing ----------
function drawBalloon(b) {
  const rad = b.r * (0.2 + 0.8 * b.air);

  const halfW = (rad * 0.92) / pix;
  const halfH = (rad * 1.08) / pix;
  const rows = floor(halfH);

  const shake = b.inflating
    ? round(sin(frameCount * 0.8) * getBlowStrength())
    : 0;

  const cx = round(b.x / pix) * pix + shake * pix;
  const cy = round(b.y / pix) * pix;

  // Balloon body
  fill(b.col);

  for (let j = -rows; j <= rows; j++) {
    const half = floor(
      halfW * sqrt(1 - (j / halfH) * (j / halfH))
    );

    block(
      cx - half * pix,
      cy + j * pix,
      2 * half + 1,
      1
    );
  }

  // Bright pixel highlight
  if (halfW >= 3) {
    fill(
      lerpColor(
        color(b.col),
        color('#FFFFFF'),
        0.78
      )
    );

    const s = max(1, round(halfW * 0.25));

    block(
      cx - round(halfW * 0.5) * pix,
      cy - round(halfH * 0.45) * pix,
      s,
      s + 1
    );
  }

  // Face (appears once the balloon has some air in it)
  drawFace(b, cx, cy, halfW, halfH);

  // Knot
  fill(b.col);
  block(cx, cy + (rows + 1) * pix);
  block(cx - pix, cy + (rows + 2) * pix, 3, 1);

  // Dark string
  fill(STRING_COLOR);

  const wiggle = floor(millis() / 350) % 2;
  const length = max(3, round((b.r * 0.4) / pix));

  for (let k = 0; k < length; k++) {
    const offset = (floor(k / 2) + wiggle) % 2;

    block(
      cx + offset * pix,
      cy + (rows + 3 + k) * pix
    );
  }
}

// ---------- pixel face ----------
// Blowing up: surprised "O" mouth. Released: smile.
function drawFace(b, cx, cy, halfW, halfH) {
  if (halfW < FACE_MIN_SIZE) return;

  const big = halfW >= 8;

  // Eye size in blocks
  const eyeW = big ? 2 : 1;
  const eyeH = big ? 3 : 2;

  // Gap from centre to each eye
  const gap = max(1, round(halfW * 0.22));
  const eyeTop = cy - round(halfH * 0.2) * pix;

  const leftX = cx - (gap + eyeW) * pix;
  const rightX = cx + (gap + 1) * pix;

  // Eyes
  fill(FACE_COLOR);
  block(leftX, eyeTop, eyeW, eyeH);
  block(rightX, eyeTop, eyeW, eyeH);

  // Little shine in the bottom-left of each eye
  if (big) {
    fill(EYE_SHINE);
    block(leftX, eyeTop + (eyeH - 1) * pix);
    block(rightX, eyeTop + (eyeH - 1) * pix);
  }

  // Mouth
  fill(FACE_COLOR);

  const mouthTop = cy + round(halfH * 0.3) * pix;

  let mouth;
  if (b.inflating) {
    mouth = big ? MOUTH_O_BIG : MOUTH_O_SMALL;
  } else {
    mouth = big ? SMILE_BIG : SMILE_SMALL;
  }

  drawPattern(mouth, cx, mouthTop);
}

// ---------- pop animation ----------
function drawRings(dt) {
  for (const r of rings) {
    r.t += dt / 0.5;

    const flicker =
      r.t > 0.5 &&
      floor(r.t * 16) % 2 === 0;

    if (!flicker) {
      fill(r.col);

      const size = r.t < 0.5 ? 2 : 1;
      const reach = r.r * (0.4 + 1.6 * r.t);

      for (let k = 0; k < 12; k++) {
        const angle = (k * TWO_PI) / 12;

        block(
          r.x + cos(angle) * reach,
          r.y + sin(angle) * reach,
          size,
          size
        );
      }
    }
  }

  rings = rings.filter(r => r.t < 1);

  if (flash > 0) {
    fill(255, flash);
    rect(0, 0, width, height);
    flash -= 12;
  }
}

// ---------- start page ----------
// y = height of the step label as a share of the screen height
const STEPS = [
  {
    label: 'STEP 1',
    lines: ['Grab your straw'],
    y: 0.287,
    pill: '#E4DCFF',
    ink: '#5A3CF0'
  },
  {
    label: 'STEP 2',
    lines: ['Slide it into place'],
    y: 0.427,
    pill: '#FFF0B3',
    ink: '#7B5E00'
  },
  {
    label: 'STEP 3',
    lines: ['breathe life into your', 'digital buddies'],
    y: 0.571,
    pill: '#E6F8CC',
    ink: '#2FA32F'
  }
];

function drawStartPage() {
  // Everything is sized from a phone-shaped column, so it also looks right on a wide screen
  const col = min(width, height * 0.5625);
  const cx = width / 2;

  // Title
  fill('#FF9E26');
  textSize(col * 0.101);
  text('BALLOONY', cx, height * 0.098);
  text('TUNES', cx, height * 0.159);

  // The three steps: a coloured label pill with the instruction under it
  const size = col * 0.032;

  for (const step of STEPS) {
    const pillW = col * 0.24;
    const pillH = size * 2.5;
    const y = height * step.y;

    fill(step.pill);
    rect(cx - pillW / 2, y - pillH / 2, pillW, pillH, pillH * 0.36);

    textSize(size);
    fill(step.ink);
    // Press Start 2P leaves empty space on the right/top of each letter, so nudge to look centred
    text(step.label, cx + size * 0.0625, y + size * 0.07);

    fill('#141414');
    for (let i = 0; i < step.lines.length; i++) {
      text(step.lines[i], cx, y + height * 0.054 + i * size * 1.9);
    }
  }

  drawReadyButton(col, cx);
}

// The READY button blinks between two looks: a bright gradient and a soft flat orange.
function drawReadyButton(col, cx) {
  const bright = floor(millis() / BUTTON_BLINK_MS) % 2 === 0;

  const w = col * 0.888;
  const h = w * 0.43;
  const cy = height * 0.856;
  const left = cx - w / 2;
  const top = cy - h / 2;

  if (bright) {
    // orange to yellow, left to right
    const gradient = drawingContext.createLinearGradient(left, 0, left + w, 0);
    gradient.addColorStop(0, '#FFA743');
    gradient.addColorStop(1, '#FFD60A');

    drawingContext.save();
    drawingContext.fillStyle = gradient;
    rect(left, top, w, h, w * 0.05);
    drawingContext.restore();
  } else {
    fill('#FFB866');
    rect(left, top, w, h, w * 0.05);
  }

  fill(bright ? '#2B1BA5' : '#8C320F');
  textSize(col * 0.054);
  text('READY?', cx, cy - h * 0.15);
  text('Tap to begin!', cx, cy + h * 0.13);
}

// ---------- text ----------
function drawText() {
  fill(TEXT_COLOR);
  textSize(min(width, height) * 0.025);

  if (!ready) {
    text(message, width / 2, height / 2);
  } else if (audioCtx && audioCtx.state !== 'running') {
    text(WAKE_HINT, width / 2, height * 0.12);
  }
}
